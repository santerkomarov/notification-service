services:
  nginx:
    image: nginx:1.27-alpine
    container_name: notification-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - notification-network

  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: notification-app
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_NAME: "Notification Service"
      APP_ENV: local
      APP_KEY: "base64:v2qZgqyyjH3iSoTP57iKq9WkYWPhx2O4eVzU4a41GPQ="
      APP_DEBUG: true
      APP_URL: "http://localhost:8080"

      LOG_CHANNEL: stderr
      LOG_LEVEL: debug

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: notification_db
      DB_USERNAME: notification_user
      DB_PASSWORD: notification_pass

      CACHE_STORE: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync

      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: notification_user
      RABBITMQ_PASSWORD: notification_pass
      RABBITMQ_VHOST: /
      RABBITMQ_QUEUE_HIGH: notifications.high
      RABBITMQ_QUEUE_LOW: notifications.low
      NOTIFICATION_MAX_ATTEMPTS: 3

      APP_RUN_MIGRATIONS: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - notification-network

  postgres:
    image: postgres:16-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - notification-network

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - notification-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: notification-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: notification_user
      RABBITMQ_DEFAULT_PASS: notification_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
        test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
        interval: 5s
        timeout: 5s
        retries: 10
    networks:
      - notification-network

  worker:
      build:
          context: .
          dockerfile: .docker/php/Dockerfile
      container_name: notification-worker
      volumes:
          - ./:/var/www/html
          - vendor_data:/var/www/html/vendor
      command: php artisan notifications:consume --sleep=1
      environment:
          APP_NAME: "Notification Service"
          APP_ENV: local
          APP_KEY: "base64:v2qZgqyyjH3iSoTP57iKq9WkYWPhx2O4eVzU4a41GPQ="
          APP_DEBUG: true
          APP_URL: "http://localhost:8080"

          LOG_CHANNEL: stderr
          LOG_LEVEL: debug

          DB_CONNECTION: pgsql
          DB_HOST: postgres
          DB_PORT: 5432
          DB_DATABASE: notification_db
          DB_USERNAME: notification_user
          DB_PASSWORD: notification_pass

          CACHE_STORE: redis
          CACHE_DRIVER: redis
          SESSION_DRIVER: redis
          QUEUE_CONNECTION: sync

          REDIS_CLIENT: predis
          REDIS_HOST: redis
          REDIS_PASSWORD: null
          REDIS_PORT: 6379

          RABBITMQ_HOST: rabbitmq
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: notification_user
          RABBITMQ_PASSWORD: notification_pass
          RABBITMQ_VHOST: /
          RABBITMQ_QUEUE_HIGH: notifications.high
          RABBITMQ_QUEUE_LOW: notifications.low
          NOTIFICATION_MAX_ATTEMPTS: 3

          APP_RUN_MIGRATIONS: false
      depends_on:
          postgres:
              condition: service_healthy
          redis:
              condition: service_started
          rabbitmq:
              condition: service_healthy
      restart: unless-stopped
      networks:
          - notification-network

networks:
  notification-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  vendor_data:
